<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Sheet</title>
<style>
:root{
  --accent:#06fc99; --accent-dim:rgba(6,252,153,.07); --accent-bg:rgba(6,252,153,.13);
  --bg:#111; --surface:#191919; --raised:#212121; --topbar-bg:#0c0c0c;
  --border:#272727; --border-mid:#363636; --border-hi:#484848;
  --text:#ededed; --muted:#888; --faint:#525252;
  --red:#f87171; --red-bg:rgba(180,58,58,.18); --yellow:#fbbf24;
  --r:6px; --r-sm:3px;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:13px/1.5 'Manrope','Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

/* --- Topbar --- */
.topbar{
  position:sticky;top:0;z-index:10;background:var(--topbar-bg);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:10px 24px;
}
.topbar h1{font-size:13px;font-weight:700;white-space:nowrap}
.slug{font:11px var(--mono);color:var(--faint)}
.spacer{flex:1}
.prog{font-size:11px;color:var(--muted);white-space:nowrap}
.prog b{color:var(--text);font-weight:700}
.prog .open{color:var(--yellow)}
.btn{
  padding:6px 12px;border:1px solid var(--border-mid);border-radius:var(--r-sm);
  font-size:12px;font-weight:600;background:var(--surface);transition:all .15s ease;
}
.btn:hover{border-color:var(--border-hi);background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#08120d}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.ghost{background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}

/* --- Layout --- */
main{max-width:1060px;margin:0 auto;padding:20px 24px 80px}
.ctx{
  font-size:12px;color:var(--muted);padding:10px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);margin-bottom:18px;
}
.ctx code{font:11px var(--mono);color:var(--faint)}

/* --- Dropzone --- */
#drop{
  margin:60px auto;max-width:520px;padding:48px 24px;text-align:center;
  border:1px dashed var(--border-mid);border-radius:var(--r);background:var(--surface);
  transition:all .15s ease;
}
#drop.hot{border-color:var(--accent);background:var(--accent-dim)}
#drop h2{font-size:15px;font-weight:700;margin-bottom:6px}
#drop p{font-size:12px;color:var(--muted)}
#drop label{
  display:inline-block;margin-top:16px;padding:6px 12px;border:1px solid var(--border-mid);
  border-radius:var(--r-sm);font-size:12px;font-weight:600;cursor:pointer;
}
#drop label:hover{border-color:var(--border-hi);background:var(--raised)}
#drop input{display:none}
/* Fehlerbox liegt bewusst ausserhalb der Dropzone: die ist verborgen, sobald ein
   Sheet geladen ist - eine Meldung darin waere unsichtbar. */
.err{color:var(--red);background:var(--red-bg);padding:8px 12px;border-radius:var(--r-sm);
  font:11px var(--mono);margin:0 auto 18px;max-width:520px;text-align:left;white-space:pre-wrap}

/* Drag-Hinweis, wenn schon ein Sheet offen ist (dann fehlt die Dropzone) */
.dragbar{
  display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  padding:8px 16px;border:1px dashed var(--accent);border-radius:var(--r);
  background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:600;
  pointer-events:none;z-index:20;
}
body.loaded.hot .dragbar{display:block}

/* --- Fragen --- */
.list{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.q{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.q:last-child{border-bottom:none}
.q.dim{opacity:.5}
.q-head{display:flex;gap:9px;align-items:baseline}
.num{font:11px var(--mono);color:var(--faint);min-width:22px;padding-top:1px}
.q-text{font-size:13px;font-weight:600;flex:1}
.dot{width:6px;height:6px;border-radius:50%;background:var(--yellow);flex:none;
  margin-top:6px;opacity:0}
.q.unanswered .dot{opacity:1}
.q.touched .dot{background:var(--accent);opacity:1}
.why{font-size:12px;color:var(--muted);margin:4px 0 0 31px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 31px}
.opt{
  padding:5px 11px;border:1px solid var(--border-mid);border-radius:var(--r-sm);
  font-size:12px;background:var(--bg);transition:all .15s ease;text-align:left;
}
.opt:hover{border-color:var(--border-hi);background:var(--raised)}
.opt.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.opt .rec{font-size:9px;font-weight:700;color:var(--faint);margin-left:6px;letter-spacing:.04em}
.opt.on .rec{color:var(--accent);opacity:.7}
textarea{
  width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border-mid);
  border-radius:var(--r-sm);padding:7px 10px;font:13px/1.5 inherit;resize:vertical;
}
textarea:focus{outline:none;border-color:var(--accent)}
.free{margin:9px 0 0 31px}
.free textarea{min-height:56px}
.note{margin:8px 0 0 31px}
.note textarea{min-height:40px;font-size:12px}
.note-btn{font-size:11px;color:var(--faint);margin:8px 0 0 31px;display:block}
.note-btn:hover{color:var(--accent)}
.ctx-btn{font-size:11px;color:var(--faint);margin:4px 0 0 31px;display:block}
.ctx-btn:hover{color:var(--accent)}
.q-ctx{
  font-size:12px;color:var(--muted);margin:6px 0 0 31px;padding:8px 10px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);
  white-space:pre-wrap;
}

/* --- Export-Dialog --- */
dialog{
  background:var(--surface);color:var(--text);border:1px solid var(--border-mid);
  border-radius:var(--r);padding:0;max-width:680px;width:calc(100% - 48px);
}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-head{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--raised);
  display:flex;align-items:center;gap:10px}
.dlg-head b{font-size:12px}
.dlg-body{padding:12px 14px}
.dlg-body textarea{font:11px/1.5 var(--mono);min-height:200px}
.hint{font-size:11px;color:var(--faint);margin-top:8px}
.hint code{font-family:var(--mono);color:var(--muted)}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="title">Decision Sheet</h1>
  <span class="slug" id="slug"></span>
  <span class="spacer"></span>
  <span class="prog" id="prog" role="status" aria-live="polite"></span>
  <button class="btn ghost" id="btn-defaults" title="Verwirft eigene Auswahlen, sodass ueberall wieder die Empfehlung gilt" hidden>Auf Empfehlungen zurücksetzen</button>
  <button class="btn ghost" id="btn-reset" hidden>Reset</button>
  <button class="btn primary" id="btn-export" hidden>Export</button>
</div>

<main>
  <div id="drop">
    <h2>Sheet hier reinziehen</h2>
    <p><code>.jsonl</code> vom Agenten — oder eine <code>.answers.json</code>, um weiterzuarbeiten.</p>
    <label>Datei wählen<input type="file" id="file" accept=".jsonl,.json,.txt"></label>
  </div>
  <div class="err" id="err" hidden></div>
  <div id="ctx" class="ctx" hidden></div>
  <div id="list" class="list" hidden></div>
</main>
<div class="dragbar">Datei ablegen zum Laden</div>

<dialog id="dlg">
  <div class="dlg-head">
    <b>Antworten</b>
    <span class="slug" id="dlg-count"></span>
    <span class="spacer"></span>
    <button class="btn" id="dlg-copy">Kopieren</button>
    <button class="btn primary" id="dlg-save">Datei speichern</button>
    <button class="btn ghost" id="dlg-close">Schließen</button>
  </div>
  <div class="dlg-body">
    <textarea id="dlg-json" readonly></textarea>
    <div class="hint">Datei landet in <code>~/Downloads</code>. Danach im Chat
      <code>#answers</code> tippen — der Hook holt sie ab.</div>
  </div>
</dialog>

<!--SHEET-DATA-->

<script>
"use strict";

/* ============ State ============
   head  : Header-Objekt des Sheets (v, sheet, title, ctx)
   qs    : Fragen-Objekte
   state : { [id]: { a: <Antwort|null>, n: <Notiz> } }  - nur was der User angefasst hat
================================= */
let head = {}, qs = [], state = {};

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const storeKey = () => "ds:" + (head.sheet || "unnamed");
// Fingerabdruck der Fragen. Schreibt der Agent das Sheet um, passen die
// gespeicherten Antworten nicht mehr zu den ids - dann lieber leer starten als
// eine alte Auswahl unter einer neuen Frage vorbelegen.
function fingerprint() {
  const s = qs.map(q => q.id + ":" + q.q + ":" + JSON.stringify(q.o || "")).join("|");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return String(h);
}

/* ---------- Laden ---------- */

function parseSheet(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const objs = lines.map((l, i) => {
    try { return JSON.parse(l); }
    catch (e) { throw new Error("Zeile " + (i + 1) + " ist kein gültiges JSON:\n" + l); }
  });
  if (!objs.length) throw new Error("Datei ist leer.");
  const first = objs[0];
  const h = first.id === undefined ? objs.shift() : {};
  if (h.q) throw new Error("Erste Zeile sieht aus wie eine Frage, hat aber keine 'id'.");
  if (!objs.length) throw new Error("Keine Fragen gefunden (nur Header).");
  // Dieselben Regeln wie render_sheet.py - das Sheet kann auch per Drag&Drop
  // hereinkommen und dann laeuft die Python-Validierung nicht.
  const types = ["pick", "multi", "yn", "text"];
  const ids = new Set();
  for (const q of objs) {
    const id = q.id === undefined || q.id === null ? "" : String(q.id);
    if (!id) throw new Error("Frage ohne 'id': " + JSON.stringify(q));
    if (ids.has(id)) throw new Error("Doppelte id '" + id + "'.");
    ids.add(id);
    if (!q.q) throw new Error("Frage #" + id + " hat keinen Fragetext ('q').");
    const t = q.t || "pick";
    if (!types.includes(t))
      throw new Error("Frage #" + id + ": Typ '" + t + "' - erlaubt: " + types.join(", ") + ".");
    if ((t === "pick" || t === "multi") && !(Array.isArray(q.o) && q.o.length))
      throw new Error("Frage #" + id + " ist '" + t + "', hat aber keine Optionen ('o').");
  }
  for (const q of objs) {
    if (q.dep === undefined) continue;
    if (!Array.isArray(q.dep) || q.dep.length !== 2)
      throw new Error("Frage #" + q.id + " hat ein defektes 'dep' - erwartet [id, wert].");
    if (!ids.has(String(q.dep[0])))
      throw new Error("Frage #" + q.id + " hängt an unbekannter id '" + q.dep[0] + "'.");
  }
  // yn-Defaults normalisieren, damit ab hier überall gegen die sichtbaren Labels
  // verglichen werden kann ("y"/true/"ja" sind alle erlaubt).
  for (const q of objs) {
    if (q.t !== "yn" || q.d === undefined) continue;
    const d = String(q.d).toLowerCase();
    q.d = (d === "y" || d === "yes" || d === "ja" || d === "true") ? "ja" : "nein";
  }
  return { head: h, qs: objs };
}

function load(text, filename) {
  const trimmed = text.trim();
  // Eine exportierte .answers.json kann als Fortsetzung eingeworfen werden. Erst als
  // Ganzes parsen (haelt auch eine von Hand pretty-printete Datei aus), sonst Sheet.
  if (trimmed.startsWith("{")) {
    let o = null;
    try { o = JSON.parse(trimmed); } catch (e) { /* dann eben als Sheet versuchen */ }
    if (o && o.sheet && o.a && typeof o.a === "object") {
      if (!qs.length) throw new Error("Erst das Sheet (.jsonl) laden, dann die Antworten.");
      if (o.sheet !== head.sheet)
        throw new Error("Antworten gehören zu Sheet '" + o.sheet + "', geladen ist '" + head.sheet + "'.");
      importAnswers(o.a);
      persist();
      render();
      return;
    }
  }
  const p = parseSheet(text);
  head = p.head; qs = p.qs; state = {};
  if (!head.sheet) head.sheet = (filename || "sheet").replace(/\.[^.]+$/, "");
  restore();
  render();
}

function importAnswers(a) {
  state = {};
  for (const [id, val] of Object.entries(a)) {
    // {"a":…,"n":…} = Antwort plus Notiz. Alles andere ist die Antwort selbst -
    // auch Arrays, die aus multi kommen. Deshalb ein Objekt statt eines Tupels:
    // ["claude","codex"] waere von [Antwort, Notiz] nicht zu unterscheiden.
    if (val && typeof val === "object" && !Array.isArray(val))
      state[id] = { a: val.a === undefined ? null : val.a, n: val.n || "" };
    else
      state[id] = { a: val, n: "" };
  }
}

/* ---------- Persistenz (gegen versehentlichen Reload) ---------- */

function persist() {
  try {
    localStorage.setItem(storeKey(), JSON.stringify({ fp: fingerprint(), s: state }));
  } catch (e) {}
}
function restore() {
  state = {};
  try {
    const raw = localStorage.getItem(storeKey());
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.fp === fingerprint()) state = o.s || {};
    else localStorage.removeItem(storeKey());
  } catch (e) {}
}

/* ---------- Fragen-Logik ---------- */

const answered = q => {
  const s = state[q.id];
  if (!s) return false;
  return (s.a !== undefined && s.a !== null && s.a !== "") || (s.n || "").trim() !== "";
};
// Effektive Antwort: was der User gewählt hat, sonst die Empfehlung.
const effective = q => {
  const s = state[q.id];
  if (s && s.a !== undefined && s.a !== null && s.a !== "") return s.a;
  return q.d;
};
// dep: [id, wert] oder [id, [wert1, wert2]] - Frage nur zeigen wenn erfüllt.
// seen bricht Ringe ab: ein Zyklus wuerde die Rekursion sonst nie beenden.
function visible(q, seen) {
  if (!q.dep) return true;
  seen = seen || new Set();
  if (seen.has(String(q.id))) return true;
  seen.add(String(q.id));
  const [depId, want] = q.dep;
  const dq = qs.find(x => String(x.id) === String(depId));
  if (!dq) return true;
  if (!visible(dq, seen)) return false;
  const got = effective(dq);
  const wants = Array.isArray(want) ? want : [want];
  if (Array.isArray(got)) return got.some(g => wants.includes(g));
  return wants.includes(got);
}
const options = q => q.t === "yn" ? ["ja", "nein"] : (q.o || []);

function set(id, val) {
  const s = state[id] || (state[id] = { a: null, n: "" });
  s.a = val;
  if ((s.a === null || s.a === "") && !(s.n || "").trim()) delete state[id];
  persist(); render();
}
function setNote(id, txt) {
  const s = state[id] || (state[id] = { a: null, n: "" });
  s.n = txt;
  if (!txt.trim() && (s.a === null || s.a === undefined || s.a === "")) delete state[id];
  persist(); updateProgress();
}

/* ---------- Rendering ---------- */

function render() {
  $("drop").hidden = true;
  document.body.classList.add("loaded");
  $("btn-export").hidden = $("btn-reset").hidden = $("btn-defaults").hidden = false;
  const title = head.title || "Decision Sheet";
  $("title").textContent = title;
  $("slug").textContent = head.sheet || "";
  document.title = head.sheet ? title + " – " + head.sheet : title;

  const ctx = $("ctx");
  if (head.ctx) {
    ctx.hidden = false;
    ctx.innerHTML = "";
    ctx.append(document.createTextNode("Kontext: "), el("code", null, head.ctx));
  } else ctx.hidden = true;

  const list = $("list");
  list.hidden = false;
  list.innerHTML = "";
  for (const q of qs) list.append(renderQ(q));
  updateProgress();
}

function renderQ(q) {
  const vis = visible(q);
  const wrap = el("div", "q" + (vis ? "" : " dim"));
  if (vis) {
    if (answered(q)) wrap.classList.add("touched");
    else if (q.d === undefined) wrap.classList.add("unanswered");
  }

  const headRow = el("div", "q-head");
  headRow.append(el("span", "dot"), el("span", "num", "#" + q.id), el("span", "q-text", q.q));
  wrap.append(headRow);

  if (q.why) wrap.append(el("div", "why", q.why));
  if (q.ctx) wrap.append(ctxToggle(q.ctx));
  if (!vis) {
    const dq = qs.find(x => String(x.id) === String(q.dep[0]));
    wrap.append(el("div", "why", "– hängt an #" + q.dep[0] +
      (dq ? " (" + [].concat(q.dep[1]).join(" / ") + ")" : "")));
    return wrap;
  }

  const cur = state[q.id] || {};

  if (q.t === "text") {
    const box = el("div", "free");
    const ta = el("textarea");
    ta.placeholder = q.d ? "Vorschlag: " + q.d : "Antwort…";
    ta.value = cur.a || "";
    ta.addEventListener("input", () => {
      const s = state[q.id] || (state[q.id] = { a: null, n: "" });
      s.a = ta.value;
      if (!ta.value.trim() && !(s.n || "").trim()) delete state[q.id];
      persist(); updateProgress();
    });
    box.append(ta);
    wrap.append(box);
  } else {
    const opts = el("div", "opts");
    const sel = effective(q);
    const isMulti = q.t === "multi";
    for (const o of options(q)) {
      const b = el("button", "opt");
      b.append(document.createTextNode(o));
      const isDefault = isMulti
        ? (Array.isArray(q.d) && q.d.includes(o))
        : eq(q.d, o);
      if (isDefault) b.append(el("span", "rec", "EMPF"));
      const on = isMulti
        ? (Array.isArray(sel) && sel.includes(o))
        : eq(sel, o);
      if (on) b.classList.add("on");
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.addEventListener("click", () => {
        if (isMulti) {
          const base = Array.isArray(sel) ? sel.slice() : [];
          const i = base.indexOf(o);
          if (i >= 0) base.splice(i, 1); else base.push(o);
          // Leeres Array bleibt erhalten: "nichts ausgewaehlt" ist bei multi eine
          // Antwort und muss die Empfehlung ueberschreiben koennen.
          set(q.id, base);
        } else {
          set(q.id, on ? null : o);
        }
      });
      opts.append(b);
    }
    wrap.append(opts);
  }

  // Notiz - immer möglich, auch zusätzlich zu einer Auswahl.
  const hasNote = (cur.n || "").trim() !== "";
  if (hasNote) wrap.append(noteBox(q, cur.n));
  else {
    const btn = el("button", "note-btn", "+ ergänzen");
    btn.addEventListener("click", () => {
      btn.replaceWith(noteBox(q, ""));
      wrap.querySelector(".note textarea").focus();
    });
    wrap.append(btn);
  }
  return wrap;
}

// Per-Frage-Kontext ist standardmaessig eingeklappt: das Sheet soll auf einen
// Blick scannbar bleiben, laengerer Hintergrund ist optional statt aufgedraengt.
function ctxToggle(text) {
  const btn = el("button", "ctx-btn", "+ Kontext");
  btn.addEventListener("click", () => {
    btn.replaceWith(el("div", "q-ctx", text));
  });
  return btn;
}

function noteBox(q, val) {
  const box = el("div", "note");
  const ta = el("textarea");
  ta.placeholder = "Ergänzung, Einschränkung, Rückfrage…";
  ta.value = val;
  ta.addEventListener("input", () => setNote(q.id, ta.value));
  box.append(ta);
  return box;
}

function updateProgress() {
  const vis = qs.filter(q => visible(q));
  const done = vis.filter(answered).length;
  const open = vis.filter(q => !answered(q) && q.d === undefined).length;
  const p = $("prog");
  p.innerHTML = "";
  p.append(el("b", null, String(done)), document.createTextNode(" / " + vis.length + " beantwortet"));
  if (open) p.append(document.createTextNode(" · "), el("span", "open", open + " offen"));
}

/* ---------- Export ----------
   Regel: Empfehlung übernommen und keine Notiz -> Eintrag wird weggelassen.
   Leere Map = alles wie vorgeschlagen.
================================= */

function buildExport() {
  const a = {};
  for (const q of qs) {
    if (!visible(q)) continue;
    const s = state[q.id];
    if (!s) continue;
    const note = (s.n || "").trim();
    const val = (s.a === undefined || s.a === "" ) ? null : s.a;
    const isDefault = val !== null && eq(val, q.d);
    if (isDefault && !note) continue;
    if (val === null && !note) continue;
    a[q.id] = note ? { a: val, n: note } : val;
  }
  return { sheet: head.sheet, a };
}

function openExport() {
  const out = buildExport();
  const json = JSON.stringify(out);
  $("dlg-json").value = json;
  const n = Object.keys(out.a).length;
  $("dlg-count").textContent = n === 0
    ? "leer = alle Empfehlungen übernommen"
    : n + " Abweichung" + (n === 1 ? "" : "en") + " · " + json.length + " Zeichen";
  $("dlg").showModal();
}

function saveFile() {
  const blob = new Blob([$("dlg-json").value], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a");
  a.href = url;
  a.download = (head.sheet || "sheet") + ".answers.json";
  a.click();
  // Sofortiges revoke bricht den Download in Firefox ab - erst nach dem Tick.
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ---------- Events ---------- */

function fail(e) {
  const box = $("err");
  box.hidden = false;
  box.textContent = e.message || String(e);
}

function readFile(f) {
  $("err").hidden = true;
  $("err").textContent = "";
  const r = new FileReader();
  r.onload = () => { try { load(r.result, f.name); } catch (e) { fail(e); } };
  r.readAsText(f);
}

const drop = $("drop");
const dragOn = on => {
  drop.classList.toggle("hot", on);
  document.body.classList.toggle("hot", on);
};
for (const ev of ["dragenter", "dragover"])
  document.addEventListener(ev, e => { e.preventDefault(); dragOn(true); });
document.addEventListener("dragleave", e => {
  if (e.relatedTarget === null) dragOn(false);
});
document.addEventListener("drop", e => {
  e.preventDefault(); dragOn(false);
  const f = e.dataTransfer.files[0];
  if (f) readFile(f);
});
$("file").addEventListener("change", e => { if (e.target.files[0]) readFile(e.target.files[0]); });

$("btn-export").addEventListener("click", openExport);
$("dlg-close").addEventListener("click", () => $("dlg").close());
$("dlg-save").addEventListener("click", saveFile);
$("dlg-copy").addEventListener("click", async () => {
  const ta = $("dlg-json");
  try { await navigator.clipboard.writeText(ta.value); }
  catch (e) { ta.select(); document.execCommand("copy"); }
  $("dlg-copy").textContent = "Kopiert";
  setTimeout(() => { $("dlg-copy").textContent = "Kopieren"; }, 1200);
});
$("btn-reset").addEventListener("click", () => {
  if (!confirm("Alle Antworten dieses Sheets verwerfen?")) return;
  state = {}; persist(); render();
});
$("btn-defaults").addEventListener("click", () => {
  // Empfehlungen sichtbar machen, ohne sie zu exportieren: Defaults sind ohnehin
  // vorausgewählt - also nur eigene Auswahlen wegräumen, Notizen behalten.
  const hasPicks = Object.values(state).some(s => s.a !== null && s.a !== undefined && s.a !== "");
  if (hasPicks && !confirm("Eigene Auswahlen verwerfen? Notizen bleiben erhalten.")) return;
  for (const [id, s] of Object.entries(state)) {
    if ((s.n || "").trim()) s.a = null; else delete state[id];
  }
  persist(); render();
});

/* ---------- Auto-Load (von render_sheet.py injiziert) ---------- */
const embedded = $("sheet-data");
if (embedded) {
  try { load(embedded.textContent, embedded.dataset.name || ""); }
  catch (e) { $("drop").hidden = false; fail(e); }
}
</script>
