# kitty.conf -- aktive Settings only (Backup, Rest ist Kitty-Default-Doku)
# Original liegt unter ~/.config/kitty/kitty.conf, dort ~1700 Zeilen auskommentierte
# Kitty-eigene Doku -- hier nur die tatsaechlich gesetzten Werte + current-theme.conf.

font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic

allow_remote_control yes

# BEGIN_KITTY_THEME
# Carbonfox (aus current-theme.conf, siehe unten), ueberschrieben mit
# Anthropic-mäßigem Hintergrund (waermer/heller als Carbonfox-Default)
include current-theme.conf
# END_KITTY_THEME

background #262624
foreground #e5e4df
