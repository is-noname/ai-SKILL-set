# ======================
# Prefix
# ======================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ======================
# Optische Anpassungen
# ======================
# Statusbar
set -g status on
set -g status-position bottom
set -g status-bg "#191919"
set -g status-fg "#b8b8b8"
set -g status-left "#[bg=#0d2e22,fg=#06fc99,bold] #S "
set -g status-right "#[fg=#888888]%H:%M | %d.%m.%Y "
set -g status-interval 60

# Fenster-Tabs (style-Syntax, tmux >= 2.9)
set -g window-status-current-style "fg=#ededed,bg=#212121,bold"
set -g window-status-style "fg=#525252,bg=#191919"
set -g window-status-activity-style "fg=#fbbf24,bg=#191919"

# Panes
set -g pane-border-style "fg=#272727"
set -g pane-active-border-style "fg=#06fc99,bold"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " #[fg=#06fc99]#{pane_index}#[fg=#525252] #{pane_current_command} · #{pane_current_path} "

# Aktivitaets-Anzeige (Fenster mit Aktivitaet werden im Status markiert)
set -g monitor-activity on
set -g visual-activity on

# ======================
# Layout: Hauptpane links (2/3) + 3 Panes rechts (1/3, je ein Drittel hoch)
# ======================
# Tastenkombination: Prefix + G
bind G new-window -n "agent-layout" -c "#{pane_current_path}" \; \
    split-window -h -l 33% -c "#{pane_current_path}" \; \
    split-window -v -l 66% -c "#{pane_current_path}" \; \
    split-window -v -l 50% -c "#{pane_current_path}" \; \
    select-pane -t '{top-left}'

# ======================
# Layout: finance - links 1 Pane (50%), rechts 2 Panes uebereinander (je 50%)
# ======================
# Tastenkombination: Prefix + F
bind F new-window -n "finance" -c "#{pane_current_path}" \; \
    split-window -h -l 50% -c "#{pane_current_path}" \; \
    split-window -v -l 50% -c "#{pane_current_path}" \; \
    select-pane -t '{top-left}'

# Standard-Einstellungen
set -g default-terminal "tmux-256color"
set -g default-command "$SHELL"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Config neu laden
bind r source-file ~/.tmux.conf \; display-message "tmux.conf neu geladen"

# ======================
# Ticket-Picker: Prefix + T oeffnet Popup mit offenen Tickets aus dem
# Projekt des aktuellen Panes (Fallback: CFO, falls dort kein tickets/
# existiert). Auswahl per fzf schickt "arbeite an <ID>: <Titel>" ins Pane,
# aus dem das Popup geoeffnet wurde.
# ======================
bind t run-shell "tmux display-popup -E -w 85% -h 70% -T ' 🎫 Tickets ' -b rounded -s 'bg=#191919,fg=#ededed' -S 'fg=#06fc99' \"TARGET_PANE=#{pane_id} bash '/home/izg/Dokumente/AI/ai-SKILL-set/scripts/ticket_picker.sh' '#{pane_current_path}'\""

# ======================
# Navigation
# ======================
# Pane-Wechsel mit Alt+Pfeiltasten (ohne Prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Splits im aktuellen Verzeichnis oeffnen
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Synchronisiertes Scrollen
set -g synchronize-panes off

# Mouse Support
set -g mouse on

# Schnelleres Escape (spuerbar responsiver in Vim/Neovim-Panes)
set -sg escape-time 0

# ======================
# Plugins (TPM)
# ======================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# TPM initialisieren (muss letzte Zeile der Config sein)
run '~/.tmux/plugins/tpm/tpm'
