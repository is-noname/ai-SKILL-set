# Verzeichnis-Scope Konfiguration fuer Claude Code
# Zeilen mit # sind Kommentare
# Format: ein Pfad pro Zeile (absolut oder mit ~)
#
# BLOCKED_DIRS: Diese Verzeichnisse sind fuer Claude gesperrt (Read/Write/Edit)
# Eintrag gilt auch fuer alle Unterverzeichnisse

BLOCKED_DIRS=(
  "$HOME/Privat"
  "$HOME/privat"
  "$HOME/Private"
  "$HOME/private"
  "$HOME/Steuern"
  "$HOME/steuern"
  "$HOME/Finanzen"
  "$HOME/finanzen"
  "$HOME/Dokumente/Steuern"
  "$HOME/Dokumente/Finanzen"
  "$HOME/Dokumente/Privat"
  "$HOME/.ssh"
  "$HOME/.gnupg"
  "$HOME/.password-store"
  "$HOME/.config/Signal"
)
